name: Security review

# What changed since the last release, read by Claude for security problems before the release is signed, with
# .github/security-review.md: the same review macos/security_review.sh runs on the releasing Mac. This one is for when
# the repository is private (on a public one its logs and summary would publish the findings): then
# `PULSAR_SECURITY_ON=github macos/release.sh …` starts it and waits, a finding marked "block" stops the release, and
# colleagues see each review here. Built the way the QA hub reviews pull requests (fosterinteractive/fi-drupal-qa,
# review.yml): the inputs collected into files first, Claude with read-only tools and no shell or network, the job's
# token read-only, the answer taken from the action's execution file. Pulsar has no pull requests (changes go to
# main), so it runs on a range of commits instead.
#
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`; a personal subscription token, which
# logging out of Claude Code invalidates).

run-name: Security review ${{ inputs.base }}..${{ inputs.head }}

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'The last release tag, e.g. v1.6.17: the review reads what changed after it.'
        required: true
        type: string
      head:
        description: 'The full SHA of the commit to release.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: security-${{ inputs.head }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Preflight the Claude credential
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set: add it under Settings > Secrets and variables > Actions (claude setup-token)."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # The inputs reach the shell as variables, checked before use: never pasted into the script.
      - name: Collect the changes
        id: collect
        env:
          BASE: ${{ inputs.base }}
          HEAD_SHA: ${{ inputs.head }}
        run: |
          set -euo pipefail
          [[ "$BASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::base must be a release tag like v1.6.17"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head must be a full commit SHA"; exit 1; }
          git rev-parse --verify -q "$BASE^{commit}" >/dev/null || { echo "::error::no tag $BASE"; exit 1; }
          git rev-parse --verify -q "$HEAD_SHA^{commit}" >/dev/null || { echo "::error::no commit $HEAD_SHA"; exit 1; }
          git merge-base --is-ancestor "$BASE" "$HEAD_SHA" || { echo "::error::$BASE is not before $HEAD_SHA"; exit 1; }
          git checkout -q "$HEAD_SHA"
          R="$RUNNER_TEMP/review"; mkdir -p "$R"
          git log --format='%h %s' "$BASE..$HEAD_SHA" > "$R/commits.txt"
          git diff --stat "$BASE" "$HEAD_SHA" > "$R/diffstat.txt"
          git diff "$BASE" "$HEAD_SHA" -- . ':(exclude)*.png' ':(exclude)*.icns' ':(exclude)*.jpg' > "$R/diff.patch"
          # the prompt as this commit has it, its header comment dropped and the inputs listed; random delimiter, so
          # nothing in it can close the output early
          python3 -I - .github/security-review.md "$R" > "$R/prompt.md" <<'PY'
          import re, sys
          text = re.sub(r"\A<!--.*?-->\s*", "", open(sys.argv[1], encoding="utf-8").read(), flags=re.S)
          d = sys.argv[2]
          print(text.replace("{{INPUTS}}", f"- Commits: {d}/commits.txt\n- Diffstat: {d}/diffstat.txt\n"
                                           f"- The diff to review: {d}/diff.patch"))
          PY
          DELIM="PROMPT_$(openssl rand -hex 16)"
          { echo "prompt<<$DELIM"; cat "$R/prompt.md"; echo "$DELIM"; } >> "$GITHUB_OUTPUT"
          # instructions written for agents in the repository are not the reviewer's: it gets only that prompt
          rm -rf CLAUDE.md AGENTS.md .claude .cursor .mcp.json
          echo "$(wc -l < "$R/commits.txt") commits, $(wc -c < "$R/diff.patch") bytes of diff"

      - name: Review with Claude
        id: claude
        timeout-minutes: 20
        uses: anthropics/claude-code-action@7b0b255830a1fab6e602658672acad11c12d841d # v1.0.226
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # this job's read-only token, never the action's app token with write access
          github_token: ${{ github.token }}
          # a prompt runs the action as an agent: it returns its answer and posts nothing
          prompt: ${{ steps.collect.outputs.prompt }}
          claude_args: |
            --model sonnet
            --max-turns 50
            --allowedTools Read,Grep,Glob
            --disallowedTools Bash,Write,Edit,MultiEdit,NotebookEdit,WebFetch,WebSearch
            --add-dir ${{ runner.temp }}/review

      # The final text is the "result" event of the action's execution file (a JSON array of SDK messages), else
      # the last assistant text. No verdict line fails the run: an unread release is never passed.
      - name: Verdict
        if: always()
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          [ -n "${EXEC:-}" ] && [ -f "$EXEC" ] || { echo "::error::Claude returned nothing to read: no verdict."; exit 1; }
          REVIEW=$(jq -r '
            ( [ .[] | select(.type == "result" and (.result | type) == "string") ] | last | .result )
            // ( [ .[] | select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text ] | last )
            // ""' "$EXEC")
          mkdir -p "$RUNNER_TEMP/out"
          printf '%s\n' "$REVIEW" > "$RUNNER_TEMP/out/review.md"
          jq -c '[ .[] | select(.type == "result") ] | last | {num_turns, duration_ms, total_cost_usd, usage}' "$EXEC" \
            > "$RUNNER_TEMP/out/usage.json" || true
          { echo "## Security review"; echo; printf '%s\n' "$REVIEW"; } >> "$GITHUB_STEP_SUMMARY"
          # the verdict is the last line, exactly, as macos/security_review.sh reads it: anything else is no pass
          VERDICT=$(printf '%s\n' "$REVIEW" | tr -d '*`' | sed '/^[[:space:]]*$/d' | tail -n 1 | sed 's/[[:space:]]*$//')
          echo "Last line: ${VERDICT:-none}"
          [ "$VERDICT" = "VERDICT: pass" ] || { echo "::error::The security review did not pass (${VERDICT:-no verdict})."; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-review
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore
          retention-days: 90
