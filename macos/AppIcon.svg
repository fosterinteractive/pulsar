<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Pulsar app icon, full bleed: the whole 1024x1024 square is the artwork, with no corners, margin or shadow of
       its own. macOS 26 masks app icons to its own rounded shape itself, and puts any icon that is not full bleed on
       a grey plate (the old 824 px tile with a margin looked broken there). The artwork was drawn on an 824 px tile
       at 100,100 and is scaled up to fill the square. The mark is the logo from web/index.html (32x32 units). -->
  <defs>
    <radialGradient id="bg" cx="512" cy="440" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#231a4e"/>
      <stop offset=".55" stop-color="#120e2e"/>
      <stop offset="1" stop-color="#08071a"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".32"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>

    <!-- Mark gradients, in the logo's own 32-unit space. -->
    <radialGradient id="halo" cx="16" cy="16" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".42"/>
      <stop offset=".45" stop-color="#7c3aed" stop-opacity=".14"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pGlow" cx="16" cy="16" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pUp" x1="16" y1="16" x2="16" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset=".35" stop-color="#22d3ee" stop-opacity=".75"/>
      <stop offset=".68" stop-color="#22d3ee" stop-opacity=".16"/>
      <stop offset=".9" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pDown" x1="16" y1="16" x2="16" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset=".35" stop-color="#f472b6" stop-opacity=".75"/>
      <stop offset=".68" stop-color="#f472b6" stop-opacity=".16"/>
      <stop offset=".9" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation=".7"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(1.2427) translate(-512 -512)">
    <!-- a few faint stars, kept away from the beams -->
    <g fill="#ffffff">
      <circle cx="262" cy="292" r="3.5" fill-opacity=".45"/>
      <circle cx="356" cy="196" r="2.5" fill-opacity=".3"/>
      <circle cx="198" cy="520" r="2.5" fill-opacity=".28"/>
      <circle cx="812" cy="458" r="3" fill-opacity=".35"/>
      <circle cx="770" cy="752" r="3.5" fill-opacity=".4"/>
      <circle cx="664" cy="850" r="2.5" fill-opacity=".26"/>
      <circle cx="846" cy="226" r="2" fill-opacity=".22"/>
      <circle cx="232" cy="790" r="2" fill-opacity=".22"/>
    </g>

    <g transform="translate(512 512) scale(22) translate(-16 -16)">
      <circle cx="16" cy="16" r="15" fill="url(#halo)"/>
      <g transform="rotate(28 16 16)">
        <!-- soft glow under the beams -->
        <g filter="url(#blur)" opacity=".75">
          <path d="M16 16 L11.4 0.5 L20.6 0.5 Z" fill="url(#pUp)"/>
          <path d="M16 16 L11.4 31.5 L20.6 31.5 Z" fill="url(#pDown)"/>
        </g>
        <path d="M16 16 L11.8 0.5 L20.2 0.5 Z" fill="url(#pUp)"/>
        <path d="M16 16 L11.8 31.5 L20.2 31.5 Z" fill="url(#pDown)"/>
        <ellipse cx="16" cy="16" rx="11.5" ry="3.6" fill="none" stroke="#8b5cf6" stroke-width="2.4" stroke-opacity=".35" filter="url(#blur)"/>
        <ellipse cx="16" cy="16" rx="11.5" ry="3.6" fill="none" stroke="#a78bfa" stroke-opacity=".95" stroke-width="1.35"/>
      </g>
      <circle cx="16" cy="16" r="9" fill="url(#pGlow)"/>
      <circle cx="16" cy="16" r="3.4" fill="#ffffff" fill-opacity=".55" filter="url(#blur)"/>
      <circle cx="16" cy="16" r="2.7" fill="#ffffff" stroke="#7c3aed" stroke-width=".7"/>
    </g>

    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
</svg>
